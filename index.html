            { name: "وليد محمد عبد اللطيف الدشتي", leh: 100, aleih: "-", motaz: 50, hamada: 50 },
            { name: "وهبة محمد حامد عبد الله", leh: 50, aleih: "-", motaz: 0, hamada: 50 },
            { name: "ياسر الشربيني الدشتي", leh: 250, aleih: "-", motaz: 100, hamada: 150 },
            { name: "ياسر عطية محمود الصعب", leh: 50, aleih: "-", motaz: 0, hamada: 50 },
            { name: "يحيى عبد الباري الشرقاوي", leh: "-", aleih: 200, motaz: 200, hamada: 0 },
            { name: "احمد البكري الدشتي", leh: 200, aleih: "-", motaz: 200, hamada: 0 }
        ];

        let data = JSON.parse(localStorage.getItem('ledgerDataFinalCommittedV80')) || initialData;

        data.forEach(item => {
            if (item.motaz === undefined) item.motaz = 0;
            if (item.hamada === undefined) item.hamada = 0;
        });

        const hamadaDebts = {
            "احمد حامد سلامة": 50,
            "زكريا إبراهيم حسين": 50,
            "حمادة موسي الشرقاوي": 50,
            "خضر علي أبو النجا": 200,
            "فكري عبده عرفات": 200,
            "محمود صابر عبد الحافظ زينب": 50,
            "مسعد الدسوقي زيادة": 50,
            "امير الإتربي عيد": 50,
            "سفيان عبد الوهاب وفا": 50,
            "حمادة رمزي الصعب": 100,
            "سعد رزق المنزلاوي": 50
        };

        data.forEach(item => {
            if (item.aleih !== "-" && !isNaN(item.aleih)) {
                let totalAmount = Number(item.aleih);
                if (hamadaDebts[item.name] !== undefined) {
                    let hamadaPart = hamadaDebts[item.name];
                    item.hamada = hamadaPart;
                    item.motaz = totalAmount - hamadaPart;
                } else {
                    item.motaz = totalAmount;
                    item.hamada = 0;
                }
            }
        });

        function normalizeText(text) {
            if (!text) return '';
            return text.toLowerCase().replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
        }

        function normalizeFirstLetter(char) {
            if (!char) return '';
            let c = char.trim();
            if (/^[أإآاآل]/.test(c) || c.startsWith('ال')) return 'ا';
            return c.charAt(0);
        }

        function sortData() {
            data.sort((a, b) => {
                let charA = normalizeFirstLetter(a.name);
                let charB = normalizeFirstLetter(b.name);
                return charA.localeCompare(charB, 'ar');
            });
        }

        function renderTable(filteredData = null) {
            sortData();
            const currentList = filteredData || data;
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            let sumLeh = 0;
            let sumAleih = 0;
            let sumMotazLeh = 0;
            let sumHamadaLeh = 0;
            let sumSaeedAleih = 0;
            let sumHamadaAleih = 0;

            data.forEach((item) => {
                const hasLeh = item.leh !== "-" && !isNaN(item.leh) && Number(item.leh) > 0;
                if (hasLeh) {
                    sumLeh += Number(item.leh);
                    sumMotazLeh += Number(item.motaz || 0);
                    sumHamadaLeh += Number(item.hamada || 0);
                }
                const hasAleih = item.aleih !== "-" && !isNaN(item.aleih) && Number(item.aleih) > 0;
                if (hasAleih) {
                    sumAleih += Number(item.aleih);
                    sumSaeedAleih += Number(item.motaz || 0);
                    sumHamadaAleih += Number(item.hamada || 0);
                }
            });

            currentList.forEach((item, index) => {
                const globalIndex = data.findIndex(d => d.name === item.name);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition duration-150 border-b border-slate-100 cursor-pointer";
                tr.onclick = () => openDetailsModal(globalIndex);
                
                tr.innerHTML = `
                    <td class="py-3 px-6 text-slate-500 font-medium">${index + 1}</td>
                    <td class="py-3 px-6 font-semibold text-slate-900">${item.name}</td>
                    <td class="py-3 px-6 text-emerald-600 font-bold">${item.leh}</td>
                    <td class="py-3 px-6 text-rose-600 font-bold">${item.aleih}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalNames').innerText = data.length;
            document.getElementById('totalLeh').innerText = sumLeh.toLocaleString('en-US');
            document.getElementById('totalAleih').innerText = sumAleih.toLocaleString('en-US');
            
            // تحديث بطاقات إجمالي التوزيع بالعناوين والمبالغ الدقيقة كما طلبت تماماً
            document.getElementById('totalMotazLeh').innerText = sumMotazLeh.toLocaleString('en-US');
            document.getElementById('totalHamadaLeh').innerText = sumHamadaLeh.toLocaleString('en-US');
            document.getElementById('totalSaeedAleih').innerText = sumSaeedAleih.toLocaleString('en-US');
            document.getElementById('totalHamadaAleih').innerText = sumHamadaAleih.toLocaleString('en-US');

            document.getElementById('resultsCount').innerText = `عرض ${currentList.length} من أصل ${data.length} اسم`;
        }

        function filterTable() {
            const rawQuery = document.getElementById('searchInput').value;
            const queryWords = normalizeText(rawQuery).split(/\s+/).filter(w => w.length > 0);
            
            if (queryWords.length === 0) {
                renderTable();
                return;
            }

            const filtered = data.filter(item => {
                const normalizedItemName = normalizeText(item.name);
                return queryWords.every(word => normalizedItemName.includes(word));
            });
            renderTable(filtered);
        }

        function openDetailsModal(index) {
            let sortedList = [...data];
            sortedList.sort((a, b) => {
                let charA = normalizeFirstLetter(a.name);
                let charB = normalizeFirstLetter(b.name);
                return charA.localeCompare(charB, 'ar');
            });

            const item = sortedList[index];
            document.getElementById('modalPersonName').innerText = item.name;

            const hasLeh = item.leh !== "-" && !isNaN(item.leh) && Number(item.leh) > 0;
            
            if (hasLeh) {
                document.getElementById('modalSubTitle').innerText = "المبالغ المسجلة الخاصة بـ معتز وحمادة";
                document.getElementById('labelField1').innerText = "معتز (عليه)";
                document.getElementById('labelField2').innerText = "حمادة (عليه)";
            } else {
                document.getElementById('modalSubTitle').innerText = "المبالغ المسجلة الخاصة بـ السعيد وحمادة";
                document.getElementById('labelField1').innerText = "السعيد (له)";
                document.getElementById('labelField2').innerText = "حمادة (له)";
            }

            document.getElementById('motazDisplay').innerText = (item.motaz || 0).toLocaleString('en-US');
            document.getElementById('hamadaDisplay').innerText = (item.hamada || 0).toLocaleString('en-US');

            document.getElementById('detailsModal').classList.remove('hidden');
            document.getElementById('detailsModal').classList.add('flex');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('flex');
            document.getElementById('detailsModal').classList.add('hidden');
        }

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
